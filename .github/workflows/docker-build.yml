name: Build ComfyUI images

on:
  push:
    branches: [main]
    paths:
      - cu130.dockerfile
      - custom-nodes.dockerfile
      - docker-entrypoint.sh
      - VERSION
      - custom_nodes
      - .github/workflows/docker-build.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Derive image names and tags
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # ghcr requires lowercase
          version="$(tr -d '[:space:]' < VERSION)"
          version="${version#v}"
          {
            echo "IMAGE=ghcr.io/${owner}/comfyui"
            echo "VERSION_TAG=${version}-cu130"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cu130.dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION_TAG }}
            ${{ env.IMAGE }}:cu130
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push custom-nodes image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: custom-nodes.dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:${{ env.VERSION_TAG }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION_TAG }}-custom
            ${{ env.IMAGE }}:cu130-custom
          cache-from: type=gha
          cache-to: type=gha,mode=max
